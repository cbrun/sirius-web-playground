services:
  database:
    image: postgres:17
    ports:
      - '5433:5432'
    environment:
      POSTGRES_DB: guesstimate-db
      POSTGRES_USER: dbuser
      POSTGRES_PASSWORD: dbpwd
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dbuser -d guesstimate-db']
      interval: 5s
      timeout: 5s
      retries: 10
  app:
    build:
      context: ../fr.obeo.dsl.guesstimate.app
      dockerfile: ../fr.obeo.dsl.guesstimate.releng/Dockerfile
    ports:
      - '8080:8080'
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://database/guesstimate-db
      SPRING_DATASOURCE_USERNAME: dbuser
      SPRING_DATASOURCE_PASSWORD: dbpwd
      SIRIUS_COMPONENTS_CORS_ALLOWEDORIGINPATTERNS: '*'
      SERVER_PORT: 8080
    depends_on:
      database:
        condition: service_healthy
