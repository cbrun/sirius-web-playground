name: Publish RESTful EMF snapshot

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/publish-restful-emf-snapshot.yml
      - restfulemf/backend/pom.xml
      - restfulemf/backend/sirius-web-restful-emf-client/pom.xml
      - restfulemf/backend/sirius-web-restful-emf-client/src/**
      - restfulemf/backend/sirius-web-restful-emf/pom.xml
      - restfulemf/backend/sirius-web-restful-emf/src/**

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Java and Maven
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: github-sirius-web
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Build and publish the snapshot
        run: >-
          mvn --batch-mode --no-transfer-progress clean deploy
          -f restfulemf/backend/pom.xml
          -DaltDeploymentRepository=github-sirius-web::https://maven.pkg.github.com/cbrun/sirius-web-playground
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
